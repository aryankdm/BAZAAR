<!DOCTYPE html>
<html lang="en">Q
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bazaar Golden Hour Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Post Processing dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Cinematic Letterbox */
        .letterbox {
            position: absolute;
            left: 0;
            width: 100%;
            height: 12vh;
            background: #000;
            z-index: 20;
            transition: transform 2s ease-in-out;
        }
        .letterbox-top { top: 0; transform: translateY(-100%); }
        .letterbox-bottom { bottom: 0; transform: translateY(100%); }
        body.cinematic .letterbox-top { transform: translateY(0); }
        body.cinematic .letterbox-bottom { transform: translateY(0); }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050301;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #d4af37;
            transition: opacity 1.5s ease;
        }
        
        .title-font {
            font-family: 'Cinzel', serif;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 2px solid transparent;
            border-top-color: #ff5588;
            border-right-color: rgba(255, 85, 136, 0.3);
            border-bottom-color: rgba(255, 85, 136, 0.1);
            border-left-color: rgba(255, 85, 136, 0.5);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 85, 136, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 85, 136, 0.8); }

        .modal-tab-active {
            border-bottom: 2px solid #ff5588;
            color: #fff !important;
        }
    </style>
</head>
<body class="cinematic">

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-ring"></div>
        <h1 class="title-font text-2xl tracking-[0.3em] uppercase bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-500 to-indigo-500">
            Gali Simulation
        </h1>
        <p class="text-xs text-pink-200/50 mt-3 tracking-widest uppercase">Rendering Vector Style</p>
    </div>

    <!-- Cinematic Bars -->
    <div class="letterbox letterbox-top flex items-center px-8">
        <div class="text-white/40 text-xs tracking-widest font-mono">CAM: 04 // BAZAAR_EXT // DUSK</div>
    </div>
    <div class="letterbox letterbox-bottom flex items-center justify-between px-8">
        <div class="text-white/40 text-xs tracking-widest font-mono">REC <span class="inline-block w-2 h-2 bg-red-500 rounded-full ml-1 animate-pulse"></span></div>
        <div class="text-white/40 text-xs tracking-widest font-mono">SYS.ONLINE</div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="mt-16">
            <h2 class="title-font text-4xl text-white/90 drop-shadow-md tracking-wider">CHANDNI CHOWK</h2>
            <p class="text-pink-400/80 text-sm tracking-widest mt-1 uppercase">Sector 4 - Evening Cycle [Vector Style]</p>
        </div>

        <div class="mb-16 flex justify-center w-full">
            <div class="bg-black/40 backdrop-blur-md border border-white/10 px-6 py-3 rounded-full flex gap-6 items-center text-white/70 text-sm">
                <div class="flex items-center gap-2"><kbd class="bg-white/20 px-2 py-0.5 rounded border border-white/30 text-white shadow-sm">S</kbd> Walk Reverse</div>
                <div class="w-px h-4 bg-white/20"></div>
                <div class="flex items-center gap-2"><kbd class="bg-white/20 px-2 py-0.5 rounded border border-white/30 text-white shadow-sm">W</kbd> Walk Forward</div>
                <div class="w-px h-4 bg-white/20"></div>
                <div class="flex items-center gap-2"><span class="bg-white/20 px-2 py-0.5 rounded border border-white/30 text-white shadow-sm text-xs">Mouse</span> Look</div>
            </div>
        </div>
    </div>

    <!-- Shop Interactive Modal -->
    <div id="shop-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md opacity-0 transition-opacity duration-300" style="pointer-events: auto;">
        <div class="bg-[#0a0a0a] border border-pink-500/30 rounded-xl w-11/12 max-w-5xl max-h-[90vh] flex flex-col shadow-2xl shadow-pink-500/20 text-gray-200">
            
            <!-- Header -->
            <div class="flex justify-between items-center p-6 border-b border-white/10">
                <div>
                    <h2 id="modal-shop-name" class="title-font text-3xl text-white tracking-wide">Shop Name</h2>
                    <p id="modal-shop-desc" class="text-pink-300/80 text-sm mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors bg-white/5 hover:bg-white/10 p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- Tabs -->
            <div class="flex px-6 border-b border-white/10 gap-6 text-sm font-medium tracking-wider uppercase">
                <button onclick="switchTab('catalogue')" id="tab-catalogue" class="py-4 text-gray-400 hover:text-white modal-tab-active transition-colors">Catalogue</button>
                <button onclick="switchTab('talk')" id="tab-talk" class="py-4 text-gray-400 hover:text-white transition-colors">Talk</button>
                <button onclick="switchTab('video')" id="tab-video" class="py-4 text-gray-400 hover:text-white transition-colors">Video Call</button>
                <button onclick="switchTab('chat')" id="tab-chat" class="py-4 text-gray-400 hover:text-white transition-colors">Chat</button>
            </div>

            <!-- Content Area -->
            <div id="modal-content-area" class="p-6 overflow-y-auto flex-1 bg-black/20">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <script>
        let camera, scene, renderer, composer;
        let playerGroup, kurtaHem, leftLeg, rightLeg;
        let dustParticles;
        let bloomPass;
        let materials = {}; // Cache for shared materials
        let gradientTexture; // Replaced noise texture with gradient for toon shading
        
        // --- SHOP DATA & INTERACTION ---
        const shopData = [
            { name: "Asiana Couture", desc: "High-end bridal lehengas with rich contemporary designs and heavy embroidery." },
            { name: "Om Parkash Jawahar Lal", desc: "Heritage store famous for luxury, elite bridal wear, and premium weaves." },
            { name: "Payal Keyal", desc: "Modern, glamorous reception gowns and experimental bridal silhouettes." },
            { name: "Sudhir Bhai Saree Wala", desc: "Highly trusted for classic traditional red bridal lehengas and great service." },
            { name: "Kamal Bhai Saree Sangam", desc: "Massive variety of regal wedding sarees, lehengas, and Banarasi silk." },
            { name: "Kala Shree Regalia", desc: "Boutique-style outlet specializing in elegant, customized hand-embroidered outfits." },
            { name: "Keshav Creations", desc: "Famous for heavy hand-embroidered wedding lehengas and party wear." },
            { name: "Kanchan Fashion", desc: "Fixed-price store with transparent pricing on trendy ethnic and bridal wear." },
            { name: "Kundans Bridal Couture", desc: "Great option for custom-made pastel and traditional red bridal lehengas." },
            { name: "Pakeeza Plaza", desc: "Multi-floor shop packed with zardosi and mirror-work lehengas for all budgets." }
        ];
        
        const raycaster = new THREE.Raycaster();
        const mouseNorm = new THREE.Vector2();
        const clickableObjects = [];
        let currentOpenShopIndex = -1;

        // Input state
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = 0;
        let targetMouseX = 0;
        const windowHalfX = window.innerWidth / 2;

        // Animation/Physics state
        let clock = new THREE.Clock();
        let playerVelocity = new THREE.Vector3();
        let isMoving = false;
        let walkTime = 0;

        // Config
        const CONFIG = {
            marketLength: 120,
            fogColor: 0xff7b9c, // Vibrant pink/sunset fog
            sunColor: 0xffdfaa,
            ambientColor: 0xffffff,
            playerSpeed: 3.5,
            cameraOffset: new THREE.Vector3(0, 1.8, 3.5)
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.fogColor);
            scene.fog = new THREE.FogExp2(CONFIG.fogColor, 0.018); 

            // Camera setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 250);
            
            // Renderer setup (High Quality but stylized)
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.BasicShadowMap; // Hard shadows for vector look
            renderer.outputEncoding = THREE.sRGBEncoding; // Clean sRGB for vibrant colors
            
            container.appendChild(renderer.domElement);

            // Post-processing
            setupPostProcessing();

            // Procedural Textures
            generateTextures();

            // Lighting
            setupLighting();

            // Build Environment
            buildGround();
            buildBazaar();
            buildOverheadWires();
            createDustParticles();

            // Build Player Character
            buildPlayer();

            // Event Listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onMouseClick);
            window.addEventListener('resize', onWindowResize);

            // Start intro sequence
            startSequence();
        }

        function setupPostProcessing() {
            const renderScene = new THREE.RenderPass(scene, camera);
            
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            // Removed BloomPass to maintain clean, crisp vector edges without glowing/blur
        }

        function generateTextures() {
            // Create a discrete 3-step gradient texture for Toon Shading
            const gradientCanvas = document.createElement('canvas');
            gradientCanvas.width = 3; gradientCanvas.height = 1;
            const context = gradientCanvas.getContext('2d');
            context.fillStyle = '#666666'; context.fillRect(0, 0, 1, 1);
            context.fillStyle = '#aaaaaa'; context.fillRect(1, 0, 1, 1);
            context.fillStyle = '#ffffff'; context.fillRect(2, 0, 1, 1);
            
            gradientTexture = new THREE.CanvasTexture(gradientCanvas);
            gradientTexture.minFilter = THREE.NearestFilter;
            gradientTexture.magFilter = THREE.NearestFilter;
            
            // Create crisp striped texture for awnings
            const stripeCanvas = document.createElement('canvas');
            stripeCanvas.width = 256; stripeCanvas.height = 256;
            const stripeCtx = stripeCanvas.getContext('2d');
            for(let i=0; i<256; i+=32) {
                stripeCtx.fillStyle = (i/32 % 2 === 0) ? '#ffffff' : '#dddddd';
                stripeCtx.fillRect(i, 0, 32, 256);
            }
            const stripeTexture = new THREE.CanvasTexture(stripeCanvas);
            stripeTexture.wrapS = THREE.RepeatWrapping; stripeTexture.wrapT = THREE.RepeatWrapping;
            stripeTexture.magFilter = THREE.NearestFilter; // Sharp edges for stripes

            // Cache common toon materials
            materials.dirt = new THREE.MeshToonMaterial({ 
                color: 0xffb870, gradientMap: gradientTexture
            });
            
            materials.wood = new THREE.MeshToonMaterial({
                color: 0x8b5a2b, gradientMap: gradientTexture
            });

            materials.plaster = new THREE.MeshToonMaterial({
                color: 0xfff3e0, gradientMap: gradientTexture
            });

            materials.cloth = new THREE.MeshToonMaterial({
                color: 0xffffff, map: stripeTexture, side: THREE.DoubleSide, gradientMap: gradientTexture
            });
            materials.cloth.map.repeat.set(2, 1);
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(CONFIG.ambientColor, 0.8); 
            scene.add(ambientLight);

            // Main Sun (Hard Directional Light for crisp shadows)
            const sunLight = new THREE.DirectionalLight(CONFIG.sunColor, 1.2); 
            sunLight.position.set(-15, 25, -50); 
            sunLight.target.position.set(0, 0, 0);
            
            // Configure shadows
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048; 
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 30;
            sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.001; 
            
            scene.add(sunLight);
            scene.add(sunLight.target);

            const hemiLight = new THREE.HemisphereLight(0xffaacc, 0x442266, 0.6);
            scene.add(hemiLight);
        }

        function buildGround() {
            const groundGroup = new THREE.Group();

            // Main road
            const roadGeo = new THREE.PlaneGeometry(12, CONFIG.marketLength * 2, 32, 128);
            const pos = roadGeo.attributes.position;
            for(let i=0; i<pos.count; i++) { pos.setZ(i, (Math.random() - 0.5) * 0.05); }
            roadGeo.computeVertexNormals();
            const road = new THREE.Mesh(roadGeo, materials.dirt);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            groundGroup.add(road);

            // Raised dirt sidewalks for stalls to sit on
            const sideWalkGeo = new THREE.PlaneGeometry(15, CONFIG.marketLength * 2);
            const sidewalkMat = new THREE.MeshStandardMaterial({color: 0x332820, roughness: 1.0});
            
            const leftSidewalk = new THREE.Mesh(sideWalkGeo, sidewalkMat);
            leftSidewalk.rotation.x = -Math.PI / 2;
            leftSidewalk.position.set(-13, 0.1, 0);
            leftSidewalk.receiveShadow = true;
            groundGroup.add(leftSidewalk);

            const rightSidewalk = new THREE.Mesh(sideWalkGeo, sidewalkMat);
            rightSidewalk.rotation.x = -Math.PI / 2;
            rightSidewalk.position.set(13, 0.1, 0);
            rightSidewalk.receiveShadow = true;
            groundGroup.add(rightSidewalk);

            scene.add(groundGroup);
        }

        function buildBazaar() {
            const wallColors = [0xFF3366, 0x00C9B1, 0xFFD166, 0x118AB2, 0xEF476F, 0x06D6A0];
            const awningColors = [0x073B4C, 0x118AB2, 0x06D6A0, 0xFFD166, 0xEF476F, 0x8338EC];
            const stallWidth = 4.5;
            let xOffset = 0;
            let shopCounter = 0;

            // Shared geometries for performance
            const sharedGeos = {
                pillar: new THREE.BoxGeometry(0.15, 2.8, 0.15),
                shelf: new THREE.BoxGeometry(3.6, 0.1, 0.6),
                basket: new THREE.CylinderGeometry(0.25, 0.15, 0.4, 16),
                spiceMound: new THREE.SphereGeometry(0.23, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
                crate: new THREE.BoxGeometry(0.5, 0.5, 0.5)
            };

            for (let z = 10; z > -CONFIG.marketLength; z -= (stallWidth + 1.5 + Math.random()*2)) {
                xOffset += (Math.random() - 0.5) * 0.4;
                xOffset = Math.max(-1.5, Math.min(1.5, xOffset));

                const leftShop = shopCounter % shopData.length; shopCounter++;
                createDetailedStall(-6.5 + xOffset, z, wallColors, awningColors, sharedGeos, 1, leftShop);
                
                const rightShop = shopCounter % shopData.length; shopCounter++;
                createDetailedStall(6.5 + xOffset, z + (Math.random()*2), wallColors, awningColors, sharedGeos, -1, rightShop);
                
                if (Math.random() > 0.3) {
                    createClutter(xOffset + (Math.random() > 0.5 ? -4 : 4), z + (Math.random() * 2), sharedGeos);
                }
            }
        }

        function createSignTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Rich dark background
            ctx.fillStyle = '#0f0f0f'; 
            ctx.fillRect(0, 0, 1024, 256);
            
            // Ornate Border
            ctx.strokeStyle = '#d4af37'; // Gold
            ctx.lineWidth = 12; 
            ctx.strokeRect(10, 10, 1004, 236);
            
            ctx.strokeStyle = '#d4af37'; 
            ctx.lineWidth = 4; 
            ctx.strokeRect(30, 30, 964, 196);
            
            // Text rendering
            ctx.fillStyle = '#ffffff';
            // Added system fallbacks to ensure text renders immediately
            ctx.font = 'bold 70px "Cinzel", "Times New Roman", serif'; 
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 10;
            
            // Scale down font if the shop name is exceptionally long
            if(text.length > 20) {
                ctx.font = 'bold 45px "Cinzel", "Times New Roman", serif';
            }
            
            ctx.fillText(text.toUpperCase(), 512, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }

        function createDetailedStall(x, z, wallColors, awningColors, geos, dir, shopIndex = 0) {
            const stallGroup = new THREE.Group();
            stallGroup.position.set(x, 0.1, z);
            stallGroup.rotation.y = (Math.PI / 2) * -dir + (Math.random() * 0.2 - 0.1);

            // INTERACTION HITBOX (Invisible block capturing clicks for this stall)
            const hitbox = new THREE.Mesh(
                new THREE.BoxGeometry(4.5, 4.0, 4.0), 
                new THREE.MeshBasicMaterial({visible: false})
            );
            hitbox.position.set(0, 2.0, 0);
            hitbox.userData.shopIndex = shopIndex;
            stallGroup.add(hitbox);
            clickableObjects.push(hitbox);

            const wColor = wallColors[Math.floor(Math.random() * wallColors.length)];
            const baseMat = new THREE.MeshToonMaterial({ color: wColor, gradientMap: gradientTexture });

            // 1. Foundation & Back Wall
            const foundation = new THREE.Mesh(new THREE.BoxGeometry(4, 0.4, 3), materials.wood);
            foundation.position.set(0, 0.2, 0);
            foundation.castShadow = true; foundation.receiveShadow = true;
            stallGroup.add(foundation);

            const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 3.5, 0.2), baseMat);
            wall.position.set(0, 2.15, -1.4);
            wall.castShadow = true; wall.receiveShadow = true;
            stallGroup.add(wall);

            // 2. Wooden Frame/Pillars
            const pFrontLeft = new THREE.Mesh(geos.pillar, materials.wood);
            pFrontLeft.position.set(-1.85, 1.8, 1.35);
            pFrontLeft.castShadow = true;
            stallGroup.add(pFrontLeft);
            
            const pFrontRight = pFrontLeft.clone();
            pFrontRight.position.set(1.85, 1.8, 1.35);
            stallGroup.add(pFrontRight);

            // Crossbeam
            const crossBeam = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.15, 0.15), materials.wood);
            crossBeam.position.set(0, 3.15, 1.35);
            crossBeam.castShadow = true;
            stallGroup.add(crossBeam);
            
            // SHOP SIGNBOARD (Moved above the shop for better visibility)
            const signTex = createSignTexture(shopData[shopIndex].name);
            const signMat = new THREE.MeshBasicMaterial({ map: signTex, side: THREE.DoubleSide });
            const signboard = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.05), signMat);
            signboard.position.set(0, 4.2, 0.5); // Positioned prominently on the roof
            stallGroup.add(signboard);

            // Signboard supports
            const leftSupport = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.15), materials.wood);
            leftSupport.position.set(-1.8, 3.7, 0.5);
            stallGroup.add(leftSupport);
            
            const rightSupport = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.15), materials.wood);
            rightSupport.position.set(1.8, 3.7, 0.5);
            stallGroup.add(rightSupport);

            // 3. Tiered Shelving
            for(let i=0; i<3; i++) {
                const shelf = new THREE.Mesh(geos.shelf, materials.wood);
                shelf.position.set(0, 0.8 + (i * 0.5), -0.8 + (i * 0.4));
                shelf.castShadow = true; shelf.receiveShadow = true;
                stallGroup.add(shelf);
            }

            // 4. Awning (Striped cloth with overhang)
            const aColor = new THREE.Color(awningColors[Math.floor(Math.random() * awningColors.length)]);
            const awningMat = materials.cloth.clone();
            awningMat.color = aColor; // Tint the stripes
            
            const awning = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 3.5, 4, 2), awningMat);
            awning.position.set(0, 3.3, 0);
            awning.rotation.x = -Math.PI / 2 + 0.25; 
            awning.castShadow = true; awning.receiveShadow = true;
            stallGroup.add(awning);

            // Hanging fringe
            const fringe = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.4), awningMat);
            fringe.position.set(0, 2.85, 1.65);
            fringe.castShadow = true;
            stallGroup.add(fringe);

            // 5. Populate Props (Spice Baskets)
            const spiceColors = [0xFF0054, 0xFFBD00, 0x390099, 0x00F5D4, 0xFF5400];
            for(let i=0; i<3; i++) {
                let rowY = 0.8 + (i * 0.5);
                let rowZ = -0.8 + (i * 0.4);
                
                // Add 3-4 items per shelf
                let items = 3 + Math.floor(Math.random()*2);
                for(let j=0; j<items; j++) {
                    let propX = -1.4 + (j * (2.8 / (items-1)));
                    
                    const sColor = spiceColors[Math.floor(Math.random() * spiceColors.length)];
                    const basketGroup = new THREE.Group();
                    
                    const basket = new THREE.Mesh(geos.basket, materials.wood);
                    basketGroup.add(basket);
                    
                    const mound = new THREE.Mesh(geos.spiceMound, new THREE.MeshToonMaterial({
                        color: sColor, gradientMap: gradientTexture
                    }));
                    mound.position.y = 0.18;
                    basketGroup.add(mound);
                    
                    basketGroup.position.set(propX, rowY + 0.25, rowZ);
                    basketGroup.castShadow = true; basketGroup.receiveShadow = true;
                    // Fix nested shadows
                    basketGroup.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
                    stallGroup.add(basketGroup);
                }
            }

            // 6. Hanging Elements (Rugs/Fabric)
            if (Math.random() > 0.4) {
                const rugMat = materials.cloth.clone();
                rugMat.color = new THREE.Color(spiceColors[Math.floor(Math.random()*spiceColors.length)]);
                const rug = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.0), rugMat);
                rug.position.set((Math.random() > 0.5 ? 1 : -1) * 1.85, 1.8, 1.35);
                rug.rotation.y = Math.PI / 2;
                rug.castShadow = true;
                stallGroup.add(rug);
            }

            // 7. Lantern
            if (Math.random() > 0.3) {
                const pointLight = new THREE.PointLight(0xfff0c2, 1.0, 8); 
                pointLight.position.set(0, 2.5, 0.8);
                
                const bulb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.1, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xfff0c2 }) // Basic flat color for vector glow
                );
                pointLight.add(bulb);
                
                const cage = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 0.3, 8, 1, true),
                    new THREE.MeshToonMaterial({color: 0x111111, wireframe: true})
                );
                pointLight.add(cage);
                
                // Chain
                const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.6), materials.wood);
                chain.position.y = 0.4;
                pointLight.add(chain);

                stallGroup.add(pointLight);
            }

            scene.add(stallGroup);
        }

        function createClutter(x, z, geos) {
            const clutterGroup = new THREE.Group();
            clutterGroup.position.set(x, 0.1, z);

            const type = Math.random();
            if (type > 0.6) {
                // Stack of varied crates
                for(let i=0; i<3; i++){
                    const crate = new THREE.Mesh(geos.crate, materials.wood);
                    crate.position.set((Math.random()-0.5)*0.3, 0.25 + (i*0.5), (Math.random()-0.5)*0.3);
                    crate.rotation.y = Math.random() * Math.PI;
                    crate.castShadow = true; crate.receiveShadow = true;
                    clutterGroup.add(crate);
                }
            } else if (type > 0.3) {
                // Large Pottery
                const points = [];
                for ( let i = 0; i < 12; i ++ ) {
                    points.push( new THREE.Vector2( Math.sin( i * 0.2 ) * 0.35 + 0.15, ( i - 6 ) * 0.12 ) );
                }
                const jug = new THREE.Mesh(new THREE.LatheGeometry( points, 24 ), new THREE.MeshToonMaterial({
                    color: 0x00b4d8, gradientMap: gradientTexture // Changed to bright blue jug
                }));
                jug.position.y = 0.7;
                jug.castShadow = true; jug.receiveShadow = true;
                clutterGroup.add(jug);
            } else {
                // Spilled Sack / Mound
                const mound = new THREE.Mesh(geos.spiceMound, new THREE.MeshToonMaterial({
                    color: 0xff0054, gradientMap: gradientTexture
                }));
                mound.scale.set(1.5, 0.5, 1.5);
                mound.position.y = 0.1;
                mound.castShadow = true;
                clutterGroup.add(mound);
            }

            scene.add(clutterGroup);
        }

        function buildOverheadWires() {
            const material = new THREE.LineBasicMaterial({ color: 0x050505, linewidth: 1 });
            
            for (let z = 5; z > -CONFIG.marketLength; z -= 6) {
                const numWires = 3 + Math.floor(Math.random() * 6);
                
                for(let w=0; w<numWires; w++) {
                    const startX = -5 - Math.random() * 2;
                    const endX = 5 + Math.random() * 2;
                    const startY = 4 + Math.random() * 4;
                    const endY = 4 + Math.random() * 4;
                    const sag = -1 - Math.random() * 2.0;

                    const curve = new THREE.QuadraticBezierCurve3(
                        new THREE.Vector3(startX, startY, z),
                        new THREE.Vector3((startX + endX)/2, Math.min(startY, endY) + sag, z - 1 + Math.random()*2),
                        new THREE.Vector3(endX, endY, z - Math.random()*2)
                    );

                    const points = curve.getPoints(30); // Higher res curves
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                }
            }
        }

        function createDustParticles() {
            const particleCount = 4000; // Double the particles
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 20;     
                positions[i * 3 + 1] = Math.random() * 8;          
                positions[i * 3 + 2] = 10 - Math.random() * (CONFIG.marketLength + 20); 

                sizes[i] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // Custom shader for solid stylized motes
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                },
                vertexShader: `
                    attribute float size;
                    varying float vAlpha;
                    void main() {
                        vAlpha = size;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (20.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 color;
                    varying float vAlpha;
                    void main() {
                        // Sharp diamond shape for vector feel
                        vec2 coord = gl_PointCoord - vec2(0.5);
                        float dist = abs(coord.x) + abs(coord.y);
                        if(dist > 0.5) discard;
                        gl_FragColor = vec4(color, vAlpha * 0.8);
                    }
                `,
                transparent: true,
                depthWrite: false
            });

            dustParticles = new THREE.Points(geometry, material);
            scene.add(dustParticles);
        }

        function buildPlayer() {
            playerGroup = new THREE.Group();
            
            const skinMat = new THREE.MeshToonMaterial({ 
                color: 0xcd853f, gradientMap: gradientTexture
            });
            const shoeMat = new THREE.MeshToonMaterial({ 
                color: 0x4a2311, gradientMap: gradientTexture 
            });
            const kurtaMat = new THREE.MeshToonMaterial({
                color: 0xffffff, gradientMap: gradientTexture, side: THREE.DoubleSide
            });

            // 1. Kurta Hem (Detailed folds using a modified cylinder)
            const hemGeo = new THREE.CylinderGeometry(0.3, 0.5, 0.8, 24, 4, true);
            // Distort vertices slightly for cloth folds
            const pos = hemGeo.attributes.position;
            for(let i=0; i<pos.count; i++){
                const angle = Math.atan2(pos.getZ(i), pos.getX(i));
                const fold = Math.sin(angle * 8) * 0.02; // 8 folds around
                pos.setX(i, pos.getX(i) * (1 + fold));
                pos.setZ(i, pos.getZ(i) * (1 + fold));
            }
            hemGeo.computeVertexNormals();

            kurtaHem = new THREE.Mesh(hemGeo, kurtaMat);
            kurtaHem.position.y = 0.9;
            kurtaHem.castShadow = true;
            playerGroup.add(kurtaHem);

            const hemCap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 24), kurtaMat);
            hemCap.position.y = 1.3;
            playerGroup.add(hemCap);

            // 2. Legs (Loose pajama pants)
            const legGeo = new THREE.CylinderGeometry(0.13, 0.09, 0.65, 16);
            
            // Left Leg Group
            leftLeg = new THREE.Group();
            leftLeg.position.set(-0.16, 0.7, 0); 
            const leftCalf = new THREE.Mesh(legGeo, kurtaMat);
            leftCalf.position.y = -0.325; 
            leftCalf.castShadow = true;
            leftLeg.add(leftCalf);
            
            // Left Foot/Sandal (More detailed shape)
            const footGeo = new THREE.BoxGeometry(0.12, 0.06, 0.28);
            const lFoot = new THREE.Mesh(footGeo, shoeMat);
            lFoot.position.set(0, -0.65, 0.05);
            lFoot.castShadow = true;
            leftLeg.add(lFoot);
            
            // Ankle/Skin visible
            const ankle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.1, 8), skinMat);
            ankle.position.set(0, -0.6, 0);
            leftLeg.add(ankle);

            playerGroup.add(leftLeg);

            // Right Leg Group
            rightLeg = new THREE.Group();
            rightLeg.position.set(0.16, 0.7, 0);
            const rightCalf = new THREE.Mesh(legGeo, kurtaMat);
            rightCalf.position.y = -0.325;
            rightCalf.castShadow = true;
            rightLeg.add(rightCalf);
            
            const rFoot = new THREE.Mesh(footGeo, shoeMat);
            rFoot.position.set(0, -0.65, 0.05);
            rFoot.castShadow = true;
            rightLeg.add(rFoot);

            const rAnkle = ankle.clone();
            rightLeg.add(rAnkle);

            playerGroup.add(rightLeg);

            // Set initial position
            playerGroup.position.set(0, 0, 8); 
            scene.add(playerGroup);

            updateCameraPosition(true);
        }

        function onKeyDown(event) {
            switch(event.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
            }
        }

        function onKeyUp(event) {
            switch(event.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
            }
        }

        function onMouseMove(event) {
            // Calculate mouse position relative to center for camera panning
            mouseX = (event.clientX - windowHalfX) * 0.002;
            
            // Normalize mouse coordinates for 3D raycasting
            mouseNorm.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouseNorm.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Check hover state to change cursor over interactive shops
            raycaster.setFromCamera(mouseNorm, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, false);
            
            if (intersects.length > 0 && !document.getElementById('shop-modal').classList.contains('!flex')) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }
        
        function onMouseClick(event) {
            // Disable 3D clicking if the UI modal is already open
            if(document.getElementById('shop-modal').classList.contains('!flex')) return;
            
            raycaster.setFromCamera(mouseNorm, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, false);
            
            if (intersects.length > 0) {
                const shopIndex = intersects[0].object.userData.shopIndex;
                openShopModal(shopIndex);
            }
        }

            currentOpenShopIndex = index;
            const shop = shopData[index];
            
            document.getElementById('modal-shop-name').innerText = shop.name;
            document.getElementById('modal-shop-desc').innerText = shop.desc;
            
            const modal = document.getElementById('shop-modal');
            modal.classList.remove('hidden');
            
            // Brief delay allows display:flex to apply before kicking off the opacity transition
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modal.classList.add('!flex'); 
                document.body.style.cursor = 'default'; 
                
                // Halt player movement while viewing catalog
                keys.w = false; keys.a = false; keys.s = false; keys.d = false; 
            }, 10);
            
            switchTab('catalogue');
        }
        
        function closeModal() {
            const modal = document.getElementById('shop-modal');
            modal.classList.remove('opacity-100');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('!flex');
                currentOpenShopIndex = -1;
            }, 300); // Wait for CSS transition to finish

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight); // Update composer size
        }

        function updateCameraPosition(instant = false) {
            // Target position behind the player
            const targetPos = new THREE.Vector3();
            targetPos.copy(playerGroup.position);
            targetPos.add(CONFIG.cameraOffset);
            
            // Add slight mouse panning for cinematic feel
            targetPos.x += mouseX * 2;

            if (instant) {
                camera.position.copy(targetPos);
            } else {
                // Smooth interpolation
                camera.position.lerp(targetPos, 0.08);
            }

            // Look slightly ahead of the player down the street
            const lookAtTarget = new THREE.Vector3(
                playerGroup.position.x + mouseX, 
                playerGroup.position.y + 1.2, 
                playerGroup.position.z - 5
            );
            camera.lookAt(lookAtTarget);
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1); // Cap delta time

            // 1. Player Movement Logic
            // Note: Z is negative going *into* the screen. 
            // W goes forward (-Z), S goes backward (+Z, reversing).
            let moveDir = 0;
            if (keys.w) moveDir -= 1;
            if (keys.s) moveDir += 1; // "Moving in reverse"

            // Horizontal movement (strafing slightly)
            let strafeDir = 0;
            if (keys.a) strafeDir -= 1;
            if (keys.d) strafeDir += 1;

            if (moveDir !== 0 || strafeDir !== 0) {
                isMoving = true;
                // Accumulate walk time based on speed for animation phase
                walkTime += dt * 8 * (moveDir !== 0 ? Math.sign(moveDir) : 1); 
                
                // Move player
                playerGroup.position.z += moveDir * CONFIG.playerSpeed * dt;
                playerGroup.position.x += strafeDir * (CONFIG.playerSpeed * 0.6) * dt;
                
                // Keep player in bounds of the street
                playerGroup.position.x = Math.max(-2, Math.min(2, playerGroup.position.x));
                // Keep in Z bounds
                playerGroup.position.z = Math.max(-CONFIG.marketLength + 5, Math.min(10, playerGroup.position.z));

            } else {
                isMoving = false;
                // Return legs to rest position smoothly
                walkTime += (0 - walkTime) * 0.1; 
            }

            // 2. Procedural Walking Animation (Sine waves)
            if (leftLeg && rightLeg) {
                // Swing legs
                const legSwing = Math.sin(walkTime) * 0.6;
                leftLeg.rotation.x = legSwing;
                rightLeg.rotation.x = -legSwing;

                // Bob character up and down slightly based on step
                const bob = Math.abs(Math.cos(walkTime)) * 0.08;
                playerGroup.position.y = bob;
                
                // Subtle rotation of hem to simulate cloth movement
                kurtaHem.rotation.z = Math.sin(walkTime) * 0.05;
                kurtaHem.rotation.x = Math.abs(Math.sin(walkTime)) * -0.05; // Flare back slightly
            }

            // 3. Update Dust Particles
            if (dustParticles) {
                const positions = dustParticles.geometry.attributes.position.array;
                for (let i = 0; i < positions.length / 3; i++) {
                    positions[i * 3 + 1] += 0.015 * dt; // y drift
                    positions[i * 3 + 2] += 0.08 * dt;  // z drift (wind)

                    // Add slight sine wave wobble to x
                    positions[i * 3] += Math.sin(clock.getElapsedTime() + i) * 0.01 * dt;

                    if (positions[i * 3 + 1] > 8) positions[i * 3 + 1] = 0;
                    if (positions[i * 3 + 2] > 15) positions[i * 3 + 2] = -CONFIG.marketLength;
                }
                dustParticles.geometry.attributes.position.needsUpdate = true;
            }

            // 4. Update Camera
            updateCameraPosition(false);

            // Use composer instead of renderer for post-processing (Bloom)
            composer.render();
        }

        function startSequence() {
            // Fake loading delay to let shaders compile and show UI
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    
                    // Show UI Layer
                    const uiLayer = document.getElementById('ui-layer');
                    uiLayer.style.opacity = '1';
                    
                    // Force a brief cinematic auto-reverse to establish the prompt's concept
                    // "camera is focused forward... character is moving in reverse"
                    keys.s = true; 
                    setTimeout(() => { keys.s = false; }, 2000);

                }, 1500);
            }, 2000);
        }
