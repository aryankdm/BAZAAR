    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Cinematic Letterbox */
        .letterbox {
            position: absolute;
            left: 0;
            width: 100%;
            height: 12vh;
            background: #000;
            z-index: 20;
            transition: transform 2s ease-in-out;
        }
        .letterbox-top { top: 0; transform: translateY(-100%); }
        .letterbox-bottom { bottom: 0; transform: translateY(100%); }
        body.cinematic .letterbox-top { transform: translateY(0); }
        body.cinematic .letterbox-bottom { transform: translateY(0); }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050301;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #d4af37;
            transition: opacity 1.5s ease;
        }
        #quote-container {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            max-width: 400px;
            pointer-events: auto; /* Allow interaction if needed */
        }
        
        .title-font {
            font-family: 'Cinzel', serif;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 2px solid transparent;
            border-top-color: #ff5588;
            border-right-color: rgba(255, 85, 136, 0.3);
            border-bottom-color: rgba(255, 85, 136, 0.1);
            border-left-color: rgba(255, 85, 136, 0.5);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 85, 136, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 85, 136, 0.8); }
